
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alerta Android</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #100000;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
}

#principal {
  padding: 35px 15px;
}

.alerta {
  color: red;
  font-size: 30px;
  font-weight: bold;
  animation: parpadeo 1s infinite;
}

@keyframes parpadeo {
  50% { opacity: .4; }
}

.caja {
  border: 3px solid red;
  border-radius: 25px;
  padding: 30px 15px;
  margin-top: 35px;
  background: #260000;
}

.barra {
  background: #444;
  height: 20px;
  border-radius: 20px;
  overflow: hidden;
  margin: 25px 0;
}

.progreso {
  background: red;
  height: 100%;
  width: 0%;
  transition: width .1s linear;
}

button {
  background: red;
  color: white;
  border: none;
  padding: 16px 30px;
  border-radius: 10px;
  font-size: 20px;
  margin-top: 15px;
}

button:disabled {
  opacity: .7;
}

#pantallaFinal {
  display: none;
  background: #e00000;
  min-height: 100vh;
  padding: 100px 20px;
  justify-content: center;
  align-items: center;
  flex-direction: column;
}

#pantallaFinal h1 {
  font-size: 30px;
}

#contador {
  font-size: 65px;
  font-weight: bold;
  margin: 25px;
}

#mensajeSeguro {
  display: none;
  background: #100000;
  min-height: 100vh;
  padding: 100px 20px;
  justify-content: center;
  align-items: center;
  flex-direction: column;
}

#mensajeSeguro h1 {
  color: #35e879;
  font-size: 27px;
}
</style>
</head>

<body>

<div id="principal">

  <div class="alerta">⚠ ¡ALERTA!</div>

  <div class="caja">

    <h1>DISPOSITIVO INFECTADO</h1>

    <p>Amenaza informática Android</p>

    <h1>☠</h1>

    <p id="estado">Esperando análisis...</p>

    <div class="barra">
      <div class="progreso" id="progreso"></div>
    </div>

    <p id="porcentaje">0%</p>

    <button id="boton" onclick="iniciar()">
      CANCELAR
    </button>

  </div>
</div>

<div id="pantallaFinal">
  <h1>¡LO SENTIMOS!</h1>

  <h1>Tu dispositivo ha sido infectado</h1>

  <p>Finalizando simulación en:</p>

  <div id="contador">3</div>
</div>

<div id="mensajeSeguro">
  <h1>✓ SIMULACIÓN EDUCATIVA</h1>

  <h2>Esto fue una simulación educativa.</h2>

  <p>Tu dispositivo no está infectado.</p>
</div>

<script>
function iniciar() {

  let valor = 0;

  let boton = document.getElementById("boton");

  boton.disabled = true;

  document.getElementById("estado").innerText =
    "Analizando sistema...";

  let intervalo = setInterval(() => {

    valor += 2;

    document.getElementById("progreso").style.width =
      valor + "%";

    document.getElementById("porcentaje").innerText =
      valor + "%";

    if (valor >= 100) {

      clearInterval(intervalo);

      document.getElementById("principal").style.display =
        "none";

      document.getElementById("pantallaFinal").style.display =
        "flex";

      let tiempo = 3;

      document.getElementById("contador").innerText = tiempo;

      let cuenta = setInterval(() => {

        tiempo--;

        document.getElementById("contador").innerText = tiempo;

        if (tiempo <= 0) {

          clearInterval(cuenta);

          document.getElementById("pantallaFinal").style.display =
            "none";

          document.getElementById("mensajeSeguro").style.display =
            "flex";

        }

      }, 1000);
    }

  }, 100);

}
</script>

</body>
</html>
